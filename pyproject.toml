[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coolcontrol"
version = "0.1.0"
description = "A fan and cooler power manager for Linux with a modern GUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CoolControl contributors" }]
keywords = ["linux", "fan", "cooler", "pwm", "hwmon", "thermal"]

dependencies = [
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coolcontrol-cli = "coolcontrol.cli:main"

[project.gui-scripts]
coolcontrol = "coolcontrol.gui:run"

[tool.setuptools]
packages = ["coolcontrol", "coolcontrol.gui"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
